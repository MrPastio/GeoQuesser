<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoQuesser</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Меню -->
<section id="menu" class="screen active">
  <div class="menu-wrap">
    <header class="brand">
      <div class="logo">◎</div>
      <div>
        <h1>GeoQuesser</h1>
        <p class="tagline">Угадай место по фото с улиц. Бесплатно, без регистрации, на открытых данных.</p>
      </div>
    </header>

    <div class="panel">
      <h2>Регион</h2>
      <div id="regions" class="chips"></div>
    </div>

    <div class="panel grid2">
      <div>
        <h2>Раундов</h2>
        <div class="chips" data-opt="rounds">
          <button data-v="3">3</button><button data-v="5" class="on">5</button><button data-v="10">10</button>
        </div>
      </div>
      <div>
        <h2>Время на раунд</h2>
        <div class="chips" data-opt="time">
          <button data-v="0" class="on">Без лимита</button><button data-v="120">2 мин</button><button data-v="60">1 мин</button><button data-v="30">30 с</button>
        </div>
      </div>
      <div>
        <h2>Снимки</h2>
        <div class="chips" data-opt="only360">
          <button data-v="0" class="on">Все</button><button data-v="1">Только 360°</button>
        </div>
      </div>
      <div>
        <h2>Перемещение</h2>
        <div class="chips" data-opt="move">
          <button data-v="1" class="on">Можно ходить</button><button data-v="0">Стоять на месте</button>
        </div>
      </div>
    </div>

    <button id="start" class="big">Играть</button>

    <div class="panel">
      <h2>Вызов от друга</h2>
      <div class="row">
        <input id="challenge-input" placeholder="Вставь ссылку на вызов">
        <button id="challenge-go" class="ghost">Принять</button>
      </div>
    </div>

    <div class="panel">
      <h2>Лучшие результаты</h2>
      <ol id="best" class="best"></ol>
    </div>

    <footer class="foot">
      Фото: <a href="https://panoramax.fr" target="_blank" rel="noopener">Panoramax</a> (CC BY-SA).
      Карта: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>.
    </footer>
  </div>
</section>

<!-- Игра -->
<section id="game" class="screen">
  <div id="pano"></div>
  <div id="loading" class="loading hidden"><div class="spinner"></div><span id="loading-text">Ищем место…</span></div>

  <div class="hud">
    <div class="hud-item"><span class="hud-label">Раунд</span><span id="hud-round">1/5</span></div>
    <div class="hud-item"><span class="hud-label">Очки</span><span id="hud-score">0</span></div>
    <div class="hud-item" id="hud-timer-wrap"><span class="hud-label">Время</span><span id="hud-timer">—</span></div>
  </div>

  <button id="quit" class="icon-btn" title="В меню">✕</button>

  <div class="nav-btns" id="nav-btns">
    <button id="back-start" class="icon-btn" title="Вернуться к началу">⌂</button>
    <button id="step-prev" class="icon-btn" title="Назад по маршруту">◀</button>
    <button id="step-next" class="icon-btn" title="Вперёд по маршруту">▶</button>
  </div>

  <div id="guess-box" class="guess-box">
    <div class="guess-tools">
      <button id="map-size" class="icon-btn small" title="Размер карты">⤢</button>
      <button id="map-pin" class="icon-btn small" title="Закрепить карту">📌</button>
    </div>
    <div id="guess-map"></div>
    <button id="guess-btn" disabled>Поставь метку на карте</button>
  </div>
</section>

<!-- Итог раунда / игры -->
<section id="result" class="screen">
  <div id="result-map"></div>
  <div class="result-card">
    <div id="result-title" class="result-title"></div>
    <div class="result-points"><span id="result-points">0</span> <small>очков</small></div>
    <div class="bar"><div id="result-bar"></div></div>
    <div id="result-dist" class="result-dist"></div>
    <div id="result-credit" class="credit"></div>
    <div id="final-extra" class="final-extra hidden">
      <ol id="rounds-list" class="rounds-list"></ol>
      <div class="row">
        <input id="share-link" readonly>
        <button id="copy-link" class="ghost">Копировать</button>
      </div>
    </div>
    <div class="row">
      <button id="next-btn" class="big">Дальше</button>
    </div>
  </div>
</section>

<div id="toast" class="toast hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
